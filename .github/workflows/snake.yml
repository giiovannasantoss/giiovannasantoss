name: generate animation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: giiovannasantoss
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#c026d3&color_dots=#f3e8ff,#e9d5ff,#d8b4fe,#c084fc,#a855f7
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#e879f9

          
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
